<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 3px solid #004d26; }
        .header { background: linear-gradient(to bottom, #004d26, #007a3d); color: white; padding: 15px; }
        .header img { width: 100px; border-radius: 50%; border: 2px solid #ffd700; }
        .partido { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; position: relative; }
        .equipo { width: 35%; font-weight: bold; font-size: 14px; }
        .opciones { width: 30%; display: flex; gap: 5px; justify-content: center; }
        .btn { border: 1px solid #ccc; background: white; padding: 8px 12px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn.active { background: #ffd700; border-color: #004d26; color: #004d26; transform: scale(1.1); }
        .footer { padding: 20px; background: #eee; }
        input[type="text"] { width: 80%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; text-transform: uppercase; }
        .total { font-size: 20px; font-weight: bold; color: #004d26; margin-bottom: 15px; }
        .btn-enviar { background: #25d366; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 90%; }
        .btn-enviar:hover { background: #128c7e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Aquí iría tu logo -->
        <h2>LA DE DIEZ GANADORA</h2>
        <p>Jornada 2 - Sin Comisión</p>
    </div>

    <div id="lista-partidos">
        <!-- Los partidos se cargan aquí con JavaScript -->
    </div>

    <div class="footer">
        <input type="text" id="nombreParticipante" placeholder="TU NOMBRE COMPLETO">
        <div class="total">TOTAL A PAGAR: $<span id="montoTotal">0</span></div>
        <button class="btn-enviar" onclick="enviarPedido()">ENVIAR A WHATSAPP 📲</button>
    </div>
</div>

<script>
    // CONFIGURA AQUÍ TUS PARTIDOS (Máximo 10, Mínimo 7)
    const partidos = [
        { l: "TIGRES", v: "CHIVAS" },
        { l: "AMÉRICA", v: "PUMAS" },
        { l: "ATLAS", v: "CRUZ AZUL" },
        { l: "TOLUCA", v: "PACHUCA" },
        { l: "BRENTFORD", v: "WEST HAM" },
        { l: "NEWCASTLE", v: "BRIGHTON" },
        { l: "ARSENAL", v: "FULHAM" }
    ];

    const contenedor = document.getElementById('lista-partidos');
    let selecciones = {};

    partidos.forEach((p, index) => {
        const div = document.createElement('div');
        div.className = 'partido';
        div.innerHTML = `
            <div class="equipo">${p.l}</div>
            <div class="opciones">
                <button class="btn" onclick="marcar(${index}, 'L', this)">L</button>
                <button class="btn" onclick="marcar(${index}, 'E', this)">E</button>
                <button class="btn" onclick="marcar(${index}, 'V', this)">V</button>
            </div>
            <div class="equipo">${p.v}</div>
        `;
        contenedor.appendChild(div);
        selecciones[index] = [];
    });

    function marcar(partidoIdx, opcion, elemento) {
        const index = selecciones[partidoIdx].indexOf(opcion);
        if (index > -1) {
            selecciones[partidoIdx].splice(index, 1);
            elemento.classList.remove('active');
        } else {
            selecciones[partidoIdx].push(opcion);
            elemento.classList.add('active');
        }
        calcularTotal();
    }

    function calcularTotal() {
        let combinaciones = 1;
        let tieneSeleccion = false;

        for (let idx in selecciones) {
            if (selecciones[idx].length > 0) {
                combinaciones *= selecciones[idx].length;
                tieneSeleccion = true;
            }
        }

        const total = tieneSeleccion ? combinaciones * 10 : 0;
        document.getElementById('montoTotal').innerText = total;
    }

    function enviarPedido() {
        const nombre = document.getElementById('nombreParticipante').value;
        if (!nombre) { alert("Por favor pon tu nombre"); return; }

        let resumen = `¡Hola! Soy ${nombre}. Mi jugada para *La de Diez Ganadora* es:\n\n`;
        
        partidos.forEach((p, i) => {
            resumen += `${i+1}. ${p.l} vs ${p.v} -> *${selecciones[i].join('')}*\n`;
        });

        resumen += `\n💰 *Total a pagar: $${document.getElementById('montoTotal').innerText}*`;
        
        // REEMPLAZA EL NÚMERO ABAJO CON EL TUYO
        const url = "https://wa.me/521TU_NUMERO_AQUI?text=" + encodeURIComponent(resumen);
        window.open(url, '_blank');
    }
</script>

</body>
</html>
