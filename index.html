<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background-color: #004d40; color: white; border-radius: 25px; width: 450px; padding: 25px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        .logo-circulo { background: white; width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border: 4px solid #fbc02d; overflow: hidden; }
        .logo-circulo img { width: 100%; height: auto; }
        
        h1 { font-size: 1.4rem; margin: 5px 0; text-transform: uppercase; }
        .input-nombre { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 20px; text-align: center; font-size: 1.1rem; font-weight: bold; box-sizing: border-box; }
        
        .btn-agregar { background-color: #002b23; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 60%; font-weight: bold; margin-bottom: 20px; }

        /* Contenedor de Quiniela */
        #contenedorPartidos { background: white; color: #333; border-radius: 20px; padding: 15px; margin-bottom: 20px; display: none; }
        .fila-partido { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; flex-direction: column; align-items: center; }
        .nombres-equipos { font-weight: bold; margin-bottom: 10px; font-size: 0.95rem; color: #004d40; }
        
        /* Botones L E V redondos */
        .selector-lev { display: flex; gap: 20px; justify-content: center; }
        .btn-lev { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; background: #f9f9f9; transition: 0.2s; }
        .btn-lev:hover { background: #eee; }
        .btn-lev.activo { background: #fbc02d; border-color: #fbc02d; color: #004d40; transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

        .monto-total { font-size: 2.2rem; font-weight: bold; color: #fbc02d; margin: 15px 0; display: block; }
        .btn-whatsapp { background-color: #2ecc71; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-circulo">
        <img src="logo.jpg" alt="Logo">
    </div>

    <h1>LA DE DIEZ GANADORA</h1>
    <p style="color:#b2dfdb; margin-bottom: 20px;">Jornada de Estreno - $10 la sencilla</p>

    <input type="text" id="nombreCliente" class="input-nombre" placeholder="NOMBRE DEL CLIENTE">

    <button class="btn-agregar" id="btnAbrir" onclick="mostrarQuiniela()">➕ AGREGAR JUGADA</button>
    
    <div id="contenedorPartidos">
        <div id="listaPartidos"></div>
        <button onclick="finalizarJugada()" style="width:100%; background:#004d40; color:white; border:none; padding:15px; border-radius:12px; margin-top:10px; cursor:pointer; font-weight:bold; font-size: 1rem;">CONFIRMAR JUGADA ✅</button>
    </div>

    <div>
        TOTAL A PAGAR:<br>
        <span class="monto-total">$<span id="txtTotal">0</span></span>
    </div>

    <button class="btn-whatsapp" onclick="enviarWhatsApp()">ENVIAR A WHATSAPP 📲</button>
</div>

<script>
const partidos = [
    {id: 1, l: "Man. City", v: "Fulham"}, {id: 2, l: "Real Madrid", v: "Alavés"},
    {id: 3, l: "América", v: "Pumas"}, {id: 4, l: "Chivas", v: "Tigres"},
    {id: 5, l: "Liverpool", v: "Chelsea"}, {id: 6, l: "Toluca", v: "Pachuca"},
    {id: 7, l: "Napoli", v: "AC Milan"}, {id: 8, l: "Barcelona", v: "Real Sociedad"},
    {id: 9, l: "Cruz Azul", v: "Monterrey"}
];

let todasLasJugadas = [];
let seleccionTemporal = {};

function mostrarQuiniela() {
    const lista = document.getElementById('listaPartidos');
    lista.innerHTML = "";
    seleccionTemporal = {}; 
    
    partidos.forEach(p => {
        lista.innerHTML += `
            <div class="fila-partido">
                <div class="nombres-equipos">${p.id}. ${p.l} vs ${p.v}</div>
                <div class="selector-lev">
                    <div class="btn-lev" onclick="marcar(${p.id}, 'L', this)">L</div>
                    <div class="btn-lev" onclick="marcar(${p.id}, 'E', this)">E</div>
                    <div class="btn-lev" onclick="marcar(${p.id}, 'V', this)">V</div>
                </div>
            </div>
        `;
    });
    document.getElementById('contenedorPartidos').style.display = 'block';
    document.getElementById('btnAbrir').style.display = 'none';
}

function marcar(id, valor, el) {
    // Quitar "activo" de los otros botones del mismo partido
    const padre = el.parentElement;
    Array.from(padre.children).forEach(b => b.classList.remove('activo'));
    
    // Poner activo al que tocamos
    el.classList.add('activo');
    seleccionTemporal[id] = valor;
}

function finalizarJugada() {
    if(Object.keys(seleccionTemporal).length < 9) {
        alert("Por favor, selecciona los 9 partidos.");
        return;
    }
    
    const combinacion = partidos.map(p => seleccionTemporal[p.id]).join('-');
    todasLasJugadas.push(combinacion);
    
    document.getElementById('txtTotal').innerText = todasLasJugadas.length * 10;
    document.getElementById('contenedorPartidos').style.display = 'none';
    document.getElementById('btnAbrir').style.display = 'inline-block';
    alert("Jugada agregada correctamente.");
}

function enviarWhatsApp() {
    const cliente = document.getElementById('nombreCliente').value;
    if(!cliente || todasLasJugadas.length === 0) {
        alert("Ingresa el nombre y al menos una jugada.");
        return;
    }
    
    let mensaje = `🏆 *LA DE DIEZ GANADORA*\n👤 *Cliente:* ${cliente.toUpperCase()}\n`;
    todasLasJugadas.forEach((j, i) => mensaje += `✅ Jugada ${i+1}: ${j}\n`);
    mensaje += `💰 *Total a pagar:* $${todasLasJugadas.length * 10}`;
    
    window.open(`https://wa.me/523113405833?text=${encodeURIComponent(mensaje)}`);
}
</script>
</body>
</html>
