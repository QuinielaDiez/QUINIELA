<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 10px; margin: 0; }
        .card { background-color: #004d40; color: white; border-radius: 20px; width: 100%; max-width: 450px; padding: 20px; text-align: center; }
        .input-nombre { width: 90%; padding: 10px; border-radius: 8px; border: none; margin-bottom: 15px; font-weight: bold; }
        
        /* Tabla de partidos */
        .tabla { background: white; color: #333; border-radius: 12px; padding: 10px; margin-bottom: 15px; }
        .fila { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.8rem; }
        .equipo { width: 35%; font-weight: bold; }
        .opciones { width: 30%; display: flex; justify-content: space-around; }
        
        .btn-v { width: 30px; height: 30px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; }
        .btn-v.activo { background: #fbc02d; color: #004d40; border-color: #fbc02d; }

        .btn-ag { background: #002b23; color: white; border: 1px solid #b2dfdb; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .total-box { margin: 15px 0; }
        .monto { font-size: 2rem; color: #fbc02d; font-weight: bold; }
        .btn-wa { background: #2ecc71; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>LA DE DIEZ GANADORA</h2>
    <input type="text" id="cliente" class="input-nombre" placeholder="TU NOMBRE">

    <div class="tabla">
        <div id="partidosLista">
            <!-- Los partidos aparecerán aquí -->
        </div>
        <button class="btn-ag" onclick="guardar()">+ AGREGAR JUGADA</button>
    </div>

    <div class="total-box">
        TOTAL:<br>
        <span class="monto" id="t">$0</span>
    </div>

    <button class="btn-wa" onclick="enviar()">ENVIAR A WHATSAPP</button>
</div>

<script>
const lista = [
    {l:"AMERICA", v:"PUMAS"}, {l:"TOLUCA", v:"PACHUCA"}, 
    {l:"CANCUN", v:"JAIBA"}, {l:"TEPA", v:"MINEROS"},
    {l:"AUSTIN", v:"LOUIS"}, {l:"INTER", v:"FLUMI"}
];

let sel = {};
let historial = [];

function iniciar() {
    const box = document.getElementById('partidosLista');
    lista.forEach((p, i) => {
        sel[i] = [];
        box.innerHTML += `
            <div class="fila">
                <div class="equipo" style="text-align:right">${p.l}</div>
                <div class="opciones">
                    <div class="btn-v" onclick="marcar(${i},'L',this)">L</div>
                    <div class="btn-v" onclick="marcar(${i},'E',this)">E</div>
                    <div class="btn-v" onclick="marcar(${i},'V',this)">V</div>
                </div>
                <div class="equipo" style="text-align:left">${p.v}</div>
            </div>`;
    });
}

function marcar(i, v, el) {
    if(sel[i].includes(v)) {
        sel[i] = sel[i].filter(x => x !== v);
        el.classList.remove('activo');
    } else {
        sel[i].push(v);
        el.classList.add('activo');
    }
}

function guardar() {
    let costo = 0;
    Object.keys(sel).forEach(k => costo += (sel[k].length * 10));
    if(costo === 0) return alert("Marca los partidos");
    
    historial.push({costo});
    let total = historial.reduce((a, b) => a + b.costo, 0);
    document.getElementById('t').innerText = "$" + total;
    
    document.querySelectorAll('.btn-v').forEach(b => b.classList.remove('activo'));
    Object.keys(sel).forEach(k => sel[k] = []);
    alert("¡Jugada agregada!");
}

function enviar() {
    const n = document.getElementById('cliente').value;
    if(!n) return alert("Pon tu nombre");
    window.open("https://wa.me/523113405833?text=Hola, soy " + n + ". Ya hice mi quiniela.");
}

iniciar();
</script>
</body>
</html>
