<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .contenedor { max-width: 500px; background: white; padding: 20px; border-radius: 10px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .partido { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .botones-opcion { display: flex; gap: 5px; }
        button.opcion { padding: 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 5px; }
        button.seleccionado { background-color: #27ae60; color: white; border-color: #27ae60; }
        .input-datos { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        #btnEnviar { width: 100%; padding: 15px; background-color: #2980b9; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        #mensajeCerrado { display: none; text-align: center; color: red; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>🏆 La de Diez Ganadora</h2>
    <p style="text-align: center;"><b>Jornada de Estreno</b></p>
    
    <div id="lista-partidos"></div>

    <hr>
    <input type="text" id="nombre" class="input-datos" placeholder="Tu Nombre Completo">
    <input type="tel" id="telefono" class="input-datos" placeholder="WhatsApp (10 dígitos)">
    
    <div id="seccionEnviar">
        <button id="btnEnviar" onclick="procesarJugada()">Enviar Jugada ($10 MXN)</button>
    </div>
    
    <div id="mensajeCerrado">
        ⚠️ La quiniela se cerró el sábado a las 6:00 AM. ¡Suerte a los participantes!
    </div>
</div>

<script>
// 1. ORDEN CRONOLÓGICO DE PARTIDOS
const partidos = [
    { id: 1, local: "Man. City", visitante: "Fulham" },
    { id: 2, local: "Real Madrid", visitante: "Alavés" },
    { id: 3, local: "América", visitante: "Pumas" },
    { id: 4, local: "Chivas", visitante: "Tigres" },
    { id: 5, local: "Liverpool", visitante: "Chelsea" },
    { id: 6, local: "Toluca", visitante: "Pachuca" },
    { id: 7, local: "Napoli", visitante: "AC Milan" },
    { id: 8, local: "Barcelona", visitante: "Real Sociedad" },
    { id: 9, local: "Cruz Azul", visitante: "Monterrey" }
];

let jugadas = {};

// 2. MOSTRAR PARTIDOS
const contenedor = document.getElementById('lista-partidos');
partidos.forEach(p => {
    contenedor.innerHTML += `
        <div class="partido">
            <span><b>${p.id}.</b> ${p.local} vs ${p.visitante}</span>
            <div class="botones-opcion">
                <button class="opcion" id="btn-${p.id}-L" onclick="seleccionar(${p.id}, 'L')">L</button>
                <button class="opcion" id="btn-${p.id}-E" onclick="seleccionar(${p.id}, 'E')">E</button>
                <button class="opcion" id="btn-${p.id}-V" onclick="seleccionar(${p.id}, 'V')">V</button>
            </div>
        </div>
    `;
});

function seleccionar(id, valor) {
    // Quitar color a los otros del mismo partido
    ['L','E','V'].forEach(opt => document.getElementById(`btn-${id}-${opt}`).classList.remove('seleccionado'));
    // Poner color al seleccionado
    document.getElementById(`btn-${id}-${valor}`).classList.add('seleccionado');
    jugadas[id] = valor;
}

// 3. BLOQUEO AUTOMÁTICO (Sábado 9 de Mayo, 6:00 AM)
function verificarHorario() {
    const ahora = new Date();
    const fechaLimite = new Date(2026, 4, 9, 6, 0, 0); // Mes 4 es Mayo en JS

    if (ahora > fechaLimite) {
        document.getElementById('seccionEnviar').style.display = 'none';
        document.getElementById('mensajeCerrado').style.display = 'block';
    }
}
setInterval(verificarHorario, 1000); // Revisa cada segundo
verificarHorario();

// 4. ENVIAR DATOS
function procesarJugada() {
    const nombre = document.getElementById('nombre').value;
    const combinacion = Object.values(jugadas).join('-');

    if (nombre === "" || Object.keys(jugadas).length < 9) {
        alert("Por favor completa tu nombre y los 9 partidos.");
        return;
    }

    // Aquí mandas los datos al PHP (usando fetch o enviando a WhatsApp)
    const mensaje = `Jugador: ${nombre}\nJugada: ${combinacion}\nMonto: $10`;
    window.location.href = `https://wa.me/523113405833?text=${encodeURIComponent(mensaje)}`;
}
</script>

</body>
</html>
