<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; padding: 15px; margin: 0; }
        .card { background-color: #004d40; color: white; border-radius: 20px; width: 100%; max-width: 480px; padding: 25px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        
        .contenedor-logo { background: white; width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border: 4px solid #fbc02d; overflow: hidden; }
        .contenedor-logo img { width: 100%; height: auto; display: block; }

        .input-nombre { width: 90%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 20px; text-align: center; font-weight: bold; font-size: 1.1rem; }

        .tabla-blanca { background: white; color: #333; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .fila { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
        .equipo { width: 35%; font-weight: bold; font-size: 0.82rem; color: #004d40; }
        .izq { text-align: right; }
        .der { text-align: left; }
        
        .opciones { width: 30%; display: flex; justify-content: space-around; }
        .btn-voto { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; font-weight: bold; background: #fdfdfd; }
        .btn-voto.activo { background: #fbc02d; border-color: #fbc02d; color: #004d40; }

        .btn-agregar { background-color: #002b23; color: white; border: 1px solid #b2dfdb; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .monto-total { font-size: 2.8rem; font-weight: bold; color: #fbc02d; margin: 10px 0; display: block; }
        .btn-whatsapp { background-color: #2ecc71; color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="contenedor-logo">
        <img src="logo.jpg" alt="Logo">
    </div>

    <h2 style="margin: 0 0 5px 0;">LA DE DIEZ GANADORA</h2>
    <p style="margin: 0 0 15px 0; color: #b2dfdb; font-size: 0.85rem;">Sencilla $10 | Doble x2 | Triple x3</p>

    <input type="text" id="nombreCliente" class="input-nombre" placeholder="NOMBRE DEL CLIENTE">

    <div class="tabla-blanca">
        <div id="listaPartidos"></div>
        <button class="btn-agregar" onclick="guardarJugada()">+ AGREGAR JUGADA</button>
    </div>

    <div style="margin: 15px 0;">
        TOTAL A PAGAR:<br>
        <span class="monto-total" id="displayTotal">$0</span>
    </div>

    <button class="btn-whatsapp" onclick="enviar()">ENVIAR A WHATSAPP 📲</button>
</div>

<script>
const partidos = [
    {id: 1, l: "BAYERN M.", v: "RB LEIPZIG"},
    {id: 2, l: "REAL MADRID", v: "ALAVÉS"},
    {id: 3, l: "TEPATITLÁN", v: "MINEROS"},
    {id: 4, l: "AMÉRICA", v: "LIGUILLA"},
    {id: 5, l: "CRUZ AZUL", v: "LIGUILLA"},
    {id: 6, l: "MAN. CITY", v: "ARSENAL"},
    {id: 7, l: "TOLUCA", v: "LIGUILLA"},
    {id: 8, l: "JUVENTUS", v: "LAZIO"},
    {id: 9, l: "TIGRES", v: "MONTERREY"}
];

let seleccionActual = {};
let totalHistorico = 0;
let todasLasJugadas = [];

function cargar() {
    const contenedor = document.getElementById('listaPartidos');
    partidos.forEach(p => {
        seleccionActual[p.id] = [];
        contenedor.innerHTML += `
            <div class="fila">
                <div class="equipo izq">${p.l}</div>
                <div class="opciones">
                    <div class="btn-voto" onclick="marcar(${p.id}, 'L', this)">L</div>
                    <div class="btn-voto" onclick="marcar(${p.id}, 'E', this)">E</div>
                    <div class="btn-voto" onclick="marcar(${p.id}, 'V', this)">V</div>
                </div>
                <div class="equipo der">${p.v}</div>
            </div>`;
    });
}

function marcar(id, valor, el) {
    if (seleccionActual[id].includes(valor)) {
        seleccionActual[id] = seleccionActual[id].filter(v => v !== valor);
        el.classList.remove('activo');
    } else {
        seleccionActual[id].push(valor);
        el.classList.add('activo');
    }
    calcularCosto();
}

function calcularCosto() {
    let combinaciones = 1;
    let tieneMarcas = false;
    partidos.forEach(p => {
        let cant = seleccionActual[p.id].length;
        if (cant > 0) {
            combinaciones *= cant;
            tieneMarcas = true;
        }
    });
    let costoEstaJugada = tieneMarcas ? (combinaciones * 10) : 0;
    document.getElementById('displayTotal').innerText = `$${totalHistorico + costoEstaJugada}`;
}

function guardarJugada() {
    let completo = true;
    let resumenHorizontal = [];

    partidos.forEach(p => {
        if (seleccionActual[p.id].length === 0) {
            completo = false;
        } else {
            // Unimos las opciones sin comas (LE, EV, LEV)
            resumenHorizontal.push(seleccionActual[p.id].join(""));
        }
    });

    if (!completo) return alert("Debes marcar los 9 partidos para guardar la jugada.");

    let montoActual = parseInt(document.getElementById('displayTotal').innerText.replace('$', ''));
    let costoEsta = montoActual - totalHistorico;

    // Guardamos la jugada con el texto separado por espacios
    todasLasJugadas.push({
        pronostico: resumenHorizontal.join(" "),
        costo: costoEsta
    });

    totalHistorico = montoActual;
    
    document.querySelectorAll('.btn-voto').forEach(b => b.classList.remove('activo'));
    partidos.forEach(p => seleccionActual[p.id] = []);
    
    alert("✅ Jugada añadida.");
    document.getElementById('displayTotal').innerText = `$${totalHistorico}`;
}

function enviar() {
    const nombre = document.getElementById('nombreCliente').value;
    const totalFinal = document.getElementById('displayTotal').innerText;

    if (!nombre) return alert("Escribe el nombre del cliente.");
    if (todasLasJugadas.length === 0) return alert("Agrega al menos una jugada.");

    let mensaje = `🏆 *LA DE DIEZ GANADORA*\n👤 *Cliente:* ${nombre.toUpperCase()}\n\n`;
    
    todasLasJugadas.forEach((j, index) => {
        mensaje += `🎮 *J${index + 1}:* ${j.pronostico} ($${j.costo})\n`;
    });

    mensaje += `\n💰 *TOTAL A PAGAR: ${totalFinal}*`;
    
    window.open(`https://wa.me/523113405833?text=${encodeURIComponent(mensaje)}`);
}

cargar();
</script>
</body>
</html>
