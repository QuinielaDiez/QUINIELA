<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Encabezado con Logo */
        .header { background-color: #064e3b; color: white; text-align: center; padding: 20px; }
        .logo-quiniela { width: 100px; height: auto; margin-bottom: 10px; }
        .header h1 { margin: 5px 0; font-size: 22px; text-transform: uppercase; }
        .header p { margin: 0; font-size: 14px; opacity: 0.9; }

        .input-cliente { padding: 15px; text-align: center; }
        input { width: 90%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; }

        /* Lista de Partidos */
        .lista-partidos { padding: 10px; }
        .fila { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        
        .bloque-equipo { display: flex; align-items: center; width: 38%; }
        .izq { justify-content: flex-end; text-align: right; }
        .der { justify-content: flex-start; text-align: left; }
        
        .logo-equipo { width: 30px; height: 30px; object-fit: contain; margin: 0 8px; }
        .nombre-equipo { font-size: 13px; font-weight: bold; color: #333; }

        /* Botones L E V */
        .opciones { display: flex; gap: 4px; }
        .btn-voto { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; font-weight: bold; background: #fff; transition: 0.2s; }
        .btn-voto.active { background-color: #064e3b; color: white; border-color: #064e3b; }

        .footer-total { background: #f9f9f9; padding: 20px; text-align: center; border-top: 2px solid #064e3b; }
        #resultado { font-size: 18px; font-weight: bold; color: #064e3b; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- AQUÍ VA TU LOGO DE LA QUINIELA -->
        <img src="logos/QUINIELA.png" class="logo-quiniela" alt="Logo La de Diez" onerror="this.style.display='none'">
        <h1>La de Diez Ganadora</h1>
        <p>Sencilla $10 | Doble x2 | Triple x3</p>
    </div>

    <div class="input-cliente">
        <input type="text" placeholder="NOMBRE DEL CLIENTE">
    </div>

    <div id="listaPartidos" class="lista-partidos">
        <!-- Los partidos se cargan aquí con JavaScript -->
    </div>

    <div class="footer-total">
        <div id="resultado">TOTAL A PAGAR: $0</div>
    </div>
</div>

<script>
    const partidos = [
        {id: 1, l: "REAL SOCIEDAD.", imgL: "logos/REALSOCIEDAD.png", v: "REAL BETIS", imgV: "logos/REALBETIS.png"},
        {id: 2, l: "CHIVAS", imgL: "logos/CHIVAS.png", v: "TIGRES", imgV: "logos/TIGRES.png"},
        {id: 3, l: "CRUZ AZUL", imgL: "logos/CRUZAZUL.png", v: "ATLAS", imgV: "logos/ATLAS.png"},
        {id: 4, l: "PORTLAND", imgL: "logos/PORTLAND.png", v: "KANSAS CITY", imgV: "logos/KANSAS CITY.png"},
        {id: 5, l: "BARCELONA", imgL: "logos/BARCELONA.png", v: "REAL MADRID", imgV: "logos/REALMADRID.png"},
        {id: 6, l: "PSG", imgL: "logos/PSG.png", v: "BREST", imgV: "logos/BREST.png"},
        {id: 7, l: "TOLOUSE", imgL: "logos/TOLOUSE.png", v: "LYON", imgV: "logos/LYON.png"},
        {id: 8, l: "PACHUCA", imgL: "logos/PACHUCA.png", v: "TOLUCA", imgV: "logos/TOLUCA.png"},
        {id: 9, l: "PUMAS", imgL: "logos/PUMAS.png", v: "AMERICA", imgV: "logos/AMERICA.png"}
    ];

    let seleccionActual = {};

    function cargar() {
        const contenedor = document.getElementById('listaPartidos');
        partidos.forEach(p => {
            seleccionActual[p.id] = [];
            contenedor.innerHTML += `
                <div class="fila">
                    <div class="bloque-equipo izq">
                        <span class="nombre-equipo">${p.l}</span>
                        <img src="${p.imgL}" class="logo-equipo" onerror="this.style.visibility='hidden'">
                    </div>

                    <div class="opciones">
                        <div class="btn-voto" onclick="marcar(${p.id}, 'L', this)">L</div>
                        <div class="btn-voto" onclick="marcar(${p.id}, 'E', this)">E</div>
                        <div class="btn-voto" onclick="marcar(${p.id}, 'V', this)">V</div>
                    </div>

                    <div class="bloque-equipo der">
                        <img src="${p.imgV}" class="logo-equipo" onerror="this.style.visibility='hidden'">
                        <span class="nombre-equipo">${p.v}</span>
                    </div>
                </div>`;
        });
    }

    function marcar(id, opcion, elemento) {
        const index = seleccionActual[id].indexOf(opcion);
        if (index > -1) {
            seleccionActual[id].splice(index, 1);
            elemento.classList.remove('active');
        } else {
            seleccionActual[id].push(opcion);
            elemento.classList.add('active');
        }
        calcularTotal();
    }

    function calcularTotal() {
        let costo = 10;
        let tieneSeleccion = false;

        Object.values(seleccionActual).forEach(votos => {
            if (votos.length > 0) {
                tieneSeleccion = true;
                if (votos.length === 2) costo *= 2;
                if (votos.length === 3) costo *= 3;
            }
        });

        document.getElementById('resultado').innerText = `TOTAL A PAGAR: $${tieneSeleccion ? costo : 0}`;
    }

    window.onload = cargar;
</script>

</body>
</html>
