<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA DE DIEZ GANADORA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* 1. LOGO Y ENCABEZADO */
        .header { background-color: #064e3b; color: white; text-align: center; padding: 25px 15px; }
        .logo-principal { width: 90px; height: 90px; background: white; border-radius: 50%; padding: 5px; margin-bottom: 12px; object-fit: contain; }
        .header h1 { margin: 0; font-size: 22px; text-transform: uppercase; }

        /* 2. NOMBRE DEL PARTICIPANTE */
        .seccion-nombre { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
        input { width: 90%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 10px; text-align: center; font-weight: bold; font-size: 16px; outline: none; }

        /* 3. LISTA DE PARTIDOS */
        .fila { display: flex; align-items: center; justify-content: space-between; padding: 15px 10px; border-bottom: 1px solid #f3f4f6; }
        .equipo { width: 35%; font-size: 13px; font-weight: 700; color: #1f2937; text-transform: uppercase; }
        .izq { text-align: right; }
        .der { text-align: left; }
        .opciones { display: flex; gap: 6px; }
        .btn-voto { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 2px solid #d1d5db; border-radius: 8px; cursor: pointer; font-weight: bold; background: #fff; }
        .btn-voto.active { background-color: #059669; color: white; border-color: #059669; }

        /* 4. BOTÓN GUARDAR JUGADA */
        .seccion-guardar { padding: 20px; background: #f9fafb; text-align: center; border-top: 1px solid #eee; }
        #costoActual { font-size: 18px; font-weight: 800; color: #064e3b; margin-bottom: 15px; }
        .btn-guardar { background-color: #064e3b; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* 5. RESUMEN Y ELIMINACIÓN */
        .seccion-ticket { padding: 20px; background: white; border-top: 2px solid #eee; }
        .jugada-card { background: #f3f4f6; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #059669; }
        .btn-borrar { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

        /* 6. TOTAL Y WHATSAPP */
        .footer { background: #064e3b; color: white; padding: 25px 20px; text-align: center; }
        #granTotal { font-size: 24px; font-weight: 900; margin-bottom: 20px; }
        .btn-enviar { background-color: #25d366; color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; font-size: 17px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logos/QUINIELA.png" class="logo-principal" onerror="this.src='https://via.placeholder.com/90?text=LOGO'">
        <h1>LA DE DIEZ GANADORA</h1>
    </div>

    <div class="seccion-nombre">
        <input type="text" id="nombreInput" placeholder="ESCRIBE TU NOMBRE AQUÍ">
    </div>

    <div id="listaPartidos"></div>

    <div class="seccion-guardar">
        <div id="costoActual">Importe esta jugada: $0</div>
        <button class="btn-guardar" onclick="guardar()">+ GUARDAR JUGADA</button>
    </div>

    <div class="seccion-ticket">
        <h4 style="margin: 0 0 15px 0; color: #064e3b;">JUGADAS GUARDADAS:</h4>
        <div id="ticketContenedor"></div>
    </div>

    <div class="footer">
        <div id="granTotal">TOTAL A PAGAR: $0</div>
        <button class="btn-enviar" onclick="enviar()">ENVIAR POR WHATSAPP</button>
    </div>
</div>

<script>
    const partidos = [
        "REAL SOCIEDAD vs REAL BETIS", "CHIVAS vs TIGRES", "CRUZ AZUL vs ATLAS",
        "PORTLAND vs KANSAS CITY", "BARCELONA vs REAL MADRID", "PSG vs BREST",
        "TOLOUSE vs LYON", "PACHUCA vs TOLUCA", "PUMAS vs AMERICA"
    ];

    let actual = {};
    let ticket = [];

    function init() {
        const div = document.getElementById('listaPartidos');
        partidos.forEach((p, i) => {
            actual[i] = [];
            const [l, v] = p.split(" vs ");
            div.innerHTML += `
                <div class="fila">
                    <div class="equipo izq">${l}</div>
                    <div class="opciones">
                        <div class="btn-voto" id="L-${i}" onclick="votar(${i},'L')">L</div>
                        <div class="btn-voto" id="E-${i}" onclick="votar(${i},'E')">E</div>
                        <div class="btn-voto" id="V-${i}" onclick="votar(${i},'V')">V</div>
                    </div>
                    <div class="equipo der">${v}</div>
                </div>`;
        });
    }

    function votar(idx, t) {
        const b = document.getElementById(`${t}-${idx}`);
        if (actual[idx].includes(t)) {
            actual[idx] = actual[idx].filter(x => x !== t);
            b.classList.remove('active');
        } else {
            actual[idx].push(t);
            b.classList.add('active');
        }
        calc();
    }

    function calc() {
        let c = 10, ok = false;
        for (let i in actual) {
            let n = actual[i].length;
            if (n > 0) ok = true;
            if (n === 2) c *= 2;
            if (n === 3) c *= 3;
        }
        const res = ok ? c : 0;
        document.getElementById('costoActual').innerText = `Importe esta jugada: $${res}`;
        return res;
    }

    function guardar() {
        const c = calc();
        if (c === 0) return alert("Selecciona resultados");
        ticket.push({ sel: JSON.parse(JSON.stringify(actual)), precio: c });
        
        // Limpiar para nueva jugada
        for (let i in actual) {
            actual[i] = [];
            ['L','E','V'].forEach(t => document.getElementById(`${t}-${i}`).classList.remove('active'));
        }
        actualizarUI();
        calc();
    }

    function borrar(i) {
        ticket.splice(i, 1);
        actualizarUI();
    }

    function actualizarUI() {
        const cont = document.getElementById('ticketContenedor');
        let h = "", total = 0;
        ticket.forEach((j, i) => {
            total += j.precio;
            h += `<div class="jugada-card">
                <div><b>Jugada #${i+1}</b> - $${j.precio}</div>
                <button class="btn-borrar" onclick="borrar(${i})">Borrar</button>
            </div>`;
        });
        cont.innerHTML = h;
        document.getElementById('granTotal').innerText = `TOTAL A PAGAR: $${total}`;
    }

    function enviar() {
        const n = document.getElementById('nombreInput').value;
        if (!n || ticket.length === 0) return alert("Falta nombre o jugadas");
        let txt = `⚽ *LA DE DIEZ GANADORA*\n👤 *Cliente:* ${n}\n\n`, tFinal = 0;
        ticket.forEach((j, idx) => {
            tFinal += j.precio;
            txt += `📝 *JUGADA #${idx+1} ($${j.precio})*\n`;
            partidos.forEach((p, i) => txt += `${i+1}. [${j.sel[i].join('-') || '---'}]\n`);
            txt += `\n`;
        });
        txt += `💰 *TOTAL FINAL: $${tFinal}*`;
        window.open(`https://wa.me/521XXXXXXXXXX?text=${encodeURIComponent(txt)}`);
    }

    init();
</script>
</body>
</html>
