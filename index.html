<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; padding: 15px; margin: 0; }
        .card { background-color: #004d40; color: white; border-radius: 20px; width: 100%; max-width: 480px; padding: 25px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
        .contenedor-logo { background: white; width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border: 4px solid #fbc02d; overflow: hidden; }
        .contenedor-logo img { width: 100%; height: auto; display: block; }
        .input-nombre { width: 90%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 20px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .tabla-blanca { background: white; color: #333; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        .fila { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
        .equipo { width: 35%; font-weight: bold; font-size: 0.82rem; color: #004d40; }
        .izq { text-align: right; }
        .der { text-align: left; }
        .opciones { width: 30%; display: flex; justify-content: space-around; }
        .btn-voto { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; font-weight: bold; background: #fdfdfd; }
        .btn-voto.activo { background: #fbc02d; border-color: #fbc02d; color: #004d40; }
        .btn-agregar { background-color: #002b23; color: white; border: 1px solid #b2dfdb; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .resumen-contenedor { margin-top: 15px; text-align: left; }
        .jugada-item { display: flex; justify-content: space-between; align-items: center; background: white; color: #333; margin-bottom: 6px; padding: 10px; border-radius: 8px; font-size: 0.85rem; border-left: 5px solid #fbc02d; }
        .btn-eliminar { background: #ff4d4d; color: white; border: none; border-radius: 4px; width: 25px; height: 25px; cursor: pointer; font-weight: bold; }
        .monto-total { font-size: 2.8rem; font-weight: bold; color: #fbc02d; margin: 10px 0; display: block; }
        .btn-whatsapp { background-color: #2ecc71; color: white; border: none; padding: 18px; border-radius: 12px; width: 100%; font-weight: bold; font-size: 1.2rem; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="contenedor-logo"><img src="logo.jpg" alt="Logo"></div>
    <h2 style="margin:0;">LA DE DIEZ GANADORA</h2>
    <p style="margin: 0 0 15px 0; color: #b2dfdb; font-size: 0.85rem;">Sencilla $10 | Doble x2 | Triple x3</p>

    <input type="text" id="nombreCliente" class="input-nombre" placeholder="NOMBRE DEL CLIENTE">

    <div class="tabla-blanca">
        <div id="listaPartidos"></div>
        <button class="btn-agregar" onclick="guardarJugada()">+ AGREGAR JUGADA</button>
    </div>

    <div id="areaResumen" class="resumen-contenedor" style="display:none;">
        <p style="margin: 0 0 8px 5px; font-weight: bold; color: #fbc02d;">JUGADAS LISTAS:</p>
        <div id="listaResumen"></div>
    </div>

    <div style="margin: 15px 0;">TOTAL A PAGAR:<br><span class="monto-total" id="displayTotal">$0</span></div>

    <button class="btn-whatsapp" onclick="enviar()">ENVIAR A WHATSAPP 📲</button>
</div>

<script>
const partidos = [
    {id: 1, l: "REAL SOCIEDAD.", imgL: "logos/REALSOCIEDAD.png", v: "REAL BETIS", imgV: "logos/REALBETIS.png"},
    {id: 2, l: "CHIVAS", imgL: "logos/CHIVAS.png", v: "TIGRES", imgV: "logos/TIGRES.png"},
    {id: 3, l: "CRUZ AZUL", imgL: "logos/CRUZAZUL.png", v: "ATLAS", imgV: "logos/ATLAS.png"},
    {id: 4, l: "PORTLAND", imgL: "logos/PORTLAND.png", v: "KANSAS CITY", imgV: "logos/KANSAS CITY.png"},
    {id: 5, l: "BARCELONA", imgL: "logos/BARCELONA.png", v: "REAL MADRID", imgV: "logos/REALMADRID.png"},
    {id: 6, l: "PSG", imgL: "logos/PSG.png", v: "BREST", imgV: "logos/BREST.png"},
    {id: 7, l: "TOLOUSE", imgL: "logos/TOLOUSE.png", v: "LYON", imgV: "logos/LYON.png"},
    {id: 8, l: "PACHUCA", imgL: "logos/PACHUCA.png", v: "TOLUCA", imgV: "logos/TOLUCA.png"},
    {id: 9, l: "PUMAS", imgL: "logos/PUMAS.png", v: "AMERICA", imgV: "logos/AMERICA.png"}
];

let seleccionActual = {};
let todasLasJugadas = [];
const ordenLetras = {"L": 1, "E": 2, "V": 3};

function cargar() {
    const contenedor = document.getElementById('listaPartidos');
    partidos.forEach(p => {
        seleccionActual[p.id] = [];
        contenedor.innerHTML += `
            <div class="fila">
                <div class="equipo izq">${p.l}</div>
                <div class="opciones">
                    <div class="btn-voto" onclick="marcar(${p.id}, 'L', this)">L</div>
                    <div class="btn-voto" onclick="marcar(${p.id}, 'E', this)">E</div>
                    <div class="btn-voto" onclick="marcar(${p.id}, 'V', this)">V</div>
                </div>
                <div class="equipo der">${p.v}</div>
            </div>`;
    });
}

function marcar(id, valor, el) {
    if (seleccionActual[id].includes(valor)) {
        seleccionActual[id] = seleccionActual[id].filter(v => v !== valor);
        el.classList.remove('activo');
    } else {
        seleccionActual[id].push(valor);
        el.classList.add('activo');
    }
    actualizarTotalVisual();
}

function calcularCostoJugada(sel) {
    let comb = 1;
    let tiene = false;
    partidos.forEach(p => {
        let n = sel[p.id].length;
        if (n > 0) { comb *= n; tiene = true; }
        else { comb = 0; }
    });
    return tiene ? (comb * 10) : 0;
}

function actualizarTotalVisual() {
    let actual = calcularCostoJugada(seleccionActual);
    let total = todasLasJugadas.reduce((s, j) => s + j.costo, 0);
    document.getElementById('displayTotal').innerText = `$${total + actual}`;
}

function guardarJugada() {
    let ok = true;
    let horizontal = [];
    partidos.forEach(p => {
        if (seleccionActual[p.id].length === 0) ok = false;
        // ORDENAR: L siempre antes que E, y E antes que V
        let ordenado = seleccionActual[p.id].sort((a,b) => ordenLetras[a] - ordenLetras[b]).join("");
        horizontal.push(ordenado);
    });

    if (!ok) return alert("Completa los 9 partidos.");

    todasLasJugadas.push({ pronostico: horizontal.join(" "), costo: calcularCostoJugada(seleccionActual) });
    
    renderResumen();
    document.querySelectorAll('.btn-voto').forEach(b => b.classList.remove('activo'));
    partidos.forEach(p => seleccionActual[p.id] = []);
    actualizarTotalVisual();
}

function renderResumen() {
    const contenedor = document.getElementById('listaResumen');
    const area = document.getElementById('areaResumen');
    contenedor.innerHTML = "";
    area.style.display = todasLasJugadas.length > 0 ? "block" : "none";
    todasLasJugadas.forEach((j, i) => {
        contenedor.innerHTML += `
            <div class="jugada-item">
                <span><b>J${i+1}:</b> ${j.pronostico} ($${j.costo})</span>
                <button class="btn-eliminar" onclick="eliminarJugada(${i})">X</button>
            </div>`;
    });
}

function eliminarJugada(i) {
    todasLasJugadas.splice(i, 1);
    renderResumen();
    actualizarTotalVisual();
}

function enviar() {
    const nombre = document.getElementById('nombreCliente').value;
    if (!nombre || todasLasJugadas.length === 0) return alert("Nombre y al menos una jugada son necesarios.");
    let total = todasLasJugadas.reduce((s, j) => s + j.costo, 0);
    let msg = `🏆 *LA DE DIEZ GANADORA*\n👤 *Cliente:* ${nombre.toUpperCase()}\n\n`;
    todasLasJugadas.forEach((j, i) => msg += `🎮 *J${i+1}:* ${j.pronostico} ($${j.costo})\n`);
    msg += `\n💰 *TOTAL A PAGAR: $${total}*`;
    window.open(`https://wa.me/523113405833?text=${encodeURIComponent(msg)}`);
}
cargar();
</script>
</body>
</html>
