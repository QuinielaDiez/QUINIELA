<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        /* Estilos basados en tu imagen image_8a1655.png */
        body { font-family: 'Arial', sans-serif; background-color: #e0e0e0; display: flex; justify-content: center; padding: 20px; }
        .card { background-color: #004d40; color: white; border-radius: 20px; width: 100%; max-width: 450px; padding: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .logo-container { background-color: white; width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; border: 3px solid #fbc02d; }
        .header h1 { font-size: 1.2rem; margin: 5px 0; letter-spacing: 1px; }
        .input-nombre { width: 90%; padding: 12px; border-radius: 10px; border: none; margin: 15px 0; text-align: center; font-weight: bold; text-transform: uppercase; }
        .btn-agregar { background-color: #00332a; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 60%; margin-bottom: 10px; }
        .info-pago { font-size: 0.9rem; margin: 10px 0; }
        .total { font-size: 1.4rem; font-weight: bold; margin: 15px 0; color: #fbc02d; }
        .btn-whatsapp { background-color: #2ecc71; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .cerrado-msg { background-color: #c0392b; color: white; padding: 15px; border-radius: 15px; display: none; font-weight: bold; }
        
        /* Estilo para la lista de partidos que se despliega */
        .lista-partidos { background: white; color: black; border-radius: 10px; margin: 10px 0; padding: 10px; text-align: left; }
        .fila-partido { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <!-- Aquí iría tu logo de 10 pesos -->
        <img src="tu-logo.png" alt="10" style="width: 60px;">
    </div>
    
    <div class="header">
        <h1>LA DE DIEZ GANADORA</h1>
        <p>Jornada 2 - $10 la sencilla</p>
    </div>

    <input type="text" id="nombreCliente" class="input-nombre" placeholder="NOMBRE DEL CLIENTE">

    <div id="areaJuego">
        <button class="btn-agregar" onclick="mostrarPartidos()">+ AGREGAR JUGADA</button>
        <div id="contenedorPartidos" style="display:none;" class="lista-partidos">
            <!-- Los partidos se cargan aquí cronológicamente -->
        </div>
    </div>

    <div class="info-pago">
        Costo jugada: <span id="costoSencilla">$10</span>
    </div>

    <div class="total">
        TOTAL A PAGAR: $<span id="montoTotal">0</span>
    </div>

    <button id="btnEnviar" class="btn-whatsapp" onclick="enviarWhatsApp()">
        ENVIAR A WHATSAPP 📲
    </button>

    <div id="mensajeBloqueo" class="cerrado-msg">
        ⚠️ JORNADA CERRADA (Límite: Sábado 6:00 AM)
    </div>
</div>

<script>
// 1. PARTIDOS EN ORDEN CRONOLÓGICO (Basado en horarios de Tepic)
const partidosOficiales = [
    { id: 1, l: "Man. City", v: "Fulham" },    // Sáb 07:00 AM
    { id: 2, l: "Real Madrid", v: "Alavés" },  // Sáb 12:00 PM
    { id: 3, l: "América", v: "Pumas" },       // Sáb 06:00 PM
    { id: 4, l: "Chivas", v: "Tigres" },       // Sáb 08:00 PM
    { id: 5, l: "Liverpool", v: "Chelsea" },   // Dom 08:30 AM
    { id: 6, l: "Toluca", v: "Pachuca" },      // Dom 11:00 AM
    { id: 7, l: "Napoli", v: "AC Milan" },     // Dom 11:45 AM
    { id: 8, l: "Barcelona", v: "Real Sociedad"},// Dom 12:00 PM
    { id: 9, l: "Cruz Azul", v: "Monterrey" }  // Dom 06:00 PM
];

let jugadasRealizadas = [];
let seleccionActual = {};

// 2. FUNCIÓN PARA MOSTRAR PARTIDOS (CRONOLÓGICO)
function mostrarPartidos() {
    const div = document.getElementById('contenedorPartidos');
    div.style.display = 'block';
    div.innerHTML = '<h4>Selecciona tus pronósticos:</h4>';
    
    partidosOficiales.forEach(p => {
        div.innerHTML += `
            <div class="fila-partido">
                <span>${p.id}. ${p.l} vs ${p.v}</span>
                <div>
                    <select onchange="guardarEleccion(${p.id}, this.value)">
                        <option value="">-</option>
                        <option value="L">L</option>
                        <option value="E">E</option>
                        <option value="V">V</option>
                    </select>
                </div>
            </div>
        `;
    });
    div.innerHTML += `<button onclick="confirmarJugada()" style="width:100%; margin-top:10px;">Confirmar Jugada</button>`;
}

function guardarEleccion(id, valor) {
    seleccionActual[id] = valor;
}

function confirmarJugada() {
    if (Object.keys(seleccionActual).length < 9) {
        alert("Debes seleccionar los 9 partidos");
        return;
    }
    
    // Convertir a formato texto L-E-V...
    const combinacion = Object.values(seleccionActual).join('-');
    jugadasRealizadas.push(combinacion);
    
    // Actualizar Interfaz
    document.getElementById('montoTotal').innerText = jugadasRealizadas.length * 10;
    document.getElementById('contenedorPartidos').style.display = 'none';
    seleccionActual = {}; 
    alert("Jugada agregada correctamente");
}

// 3. BLOQUEO AUTOMÁTICO (Sábado 9 de Mayo, 6:00 AM)
function verificarReloj() {
    const ahora = new Date();
    const limite = new Date(2026, 4, 9, 6, 0, 0); // Mayo es 4 en JS

    if (ahora >= limite) {
        document.getElementById('btnEnviar').style.display = 'none';
        document.getElementById('areaJuego').style.display = 'none';
        document.getElementById('mensajeBloqueo').style.display = 'block';
    }
}
setInterval(verificarReloj, 1000);
verificarReloj();

// 4. ENVÍO A WHATSAPP
function enviarWhatsApp() {
    const nombre = document.getElementById('nombreCliente').value;
    const total = document.getElementById('montoTotal').innerText;

    if (!nombre || jugadasRealizadas.length === 0) {
        alert("Ingresa nombre y al menos una jugada");
        return;
    }

    let cuerpoMensaje = `🏆 *LA DE DIEZ GANADORA*\n`;
    cuerpoMensaje += `👤 Cliente: ${nombre}\n`;
    cuerpoMensaje += `--------------------------\n`;
    
    jugadasRealizadas.forEach((j, index) => {
        cuerpoMensaje += `Jugada ${index + 1}: ${j}\n`;
    });

    cuerpoMensaje += `--------------------------\n`;
    cuerpoMensaje += `💰 *TOTAL A PAGAR: $${total}*`;

    const url = `https://wa.me/523113405833?text=${encodeURIComponent(cuerpoMensaje)}`;
    window.open(url, '_blank');
}
</script>
</body>
</html>
