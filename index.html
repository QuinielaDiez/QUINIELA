<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 450px; margin: auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 2px solid #004d26; }
        .header { background: #004d26; color: white; padding: 20px; }
        /* ESTO AGREGA TU LOGO */
        .header img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #ffd700; margin-bottom: 10px; background: white; }
        .partido { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #eee; }
        .equipo { width: 35%; font-weight: bold; font-size: 13px; color: #333; text-transform: uppercase; }
        .opciones { width: 30%; display: flex; gap: 4px; justify-content: center; }
        .btn { border: 1px solid #ddd; background: #fff; padding: 10px 12px; cursor: pointer; border-radius: 6px; font-weight: bold; flex: 1; transition: 0.2s; }
        .btn.active { background: #ffd700; border-color: #004d26; color: #004d26; }
        .footer { padding: 20px; background: #f9f9f9; }
        input[type="text"] { width: 90%; padding: 12px; margin-bottom: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; text-align: center; }
        .total { font-size: 22px; font-weight: bold; color: #004d26; margin-bottom: 15px; }
        .btn-enviar { background: #25d366; color: white; border: none; padding: 16px; font-size: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- BUSCARÁ UNA IMAGEN LLAMADA logo.jpg EN TU GITHUB -->
        <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'">
        <h2 style="margin:0">LA DE DIEZ GANADORA</h2>
        <p style="margin:5px 0 0; opacity: 0.8;">Jornada 2 - Sin Comisión</p>
    </div>

    <div id="lista-partidos"></div>

    <div class="footer">
        <input type="text" id="nombreParticipante" placeholder="ESCRIBE TU NOMBRE">
        <div class="total">TOTAL: $<span id="montoTotal">0</span></div>
        <button class="btn-enviar" onclick="enviarPedido()">ENVIAR REGISTRO 📲</button>
    </div>
</div>

<script>
    const partidos = [
        { l: "BRENTFORD", v: "WEST HAM" },
        { l: "NEWCASTLE", v: "BRIGHTON" },
        { l: "ARSENAL", v: "FULHAM" },
        { l: "TIGRES", v: "CHIVAS" },
        { l: "ATLAS", v: "CRUZ AZUL" },
        { l: "MAN. UNITED", v: "LIVERPOOL" },
        { l: "ASTON VILLA", v: "TOTTENHAM" },
        { l: "AMÉRICA", v: "PUMAS" },
        { l: "TOLUCA", v: "PACHUCA" }
    ];

    const contenedor = document.getElementById('lista-partidos');
    let selecciones = {};

    partidos.forEach((p, index) => {
        const div = document.createElement('div');
        div.className = 'partido';
        div.innerHTML = `
            <div class="equipo" style="text-align:right">${p.l}</div>
            <div class="opciones">
                <button class="btn" onclick="marcar(${index}, 'L', this)">L</button>
                <button class="btn" onclick="marcar(${index}, 'E', this)">E</button>
                <button class="btn" onclick="marcar(${index}, 'V', this)">V</button>
            </div>
            <div class="equipo" style="text-align:left">${p.v}</div>
        `;
        contenedor.appendChild(div);
        selecciones[index] = [];
    });

    function marcar(partidoIdx, opcion, elemento) {
        const idx = selecciones[partidoIdx].indexOf(opcion);
        if (idx > -1) {
            selecciones[partidoIdx].splice(idx, 1);
            elemento.classList.remove('active');
        } else {
            selecciones[partidoIdx].push(opcion);
            elemento.classList.add('active');
        }
        calcularTotal();
    }

    function calcularTotal() {
        let combinaciones = 1;
        let tieneSeleccion = false;
        for (let idx in selecciones) {
            if (selecciones[idx].length > 0) {
                combinaciones *= selecciones[idx].length;
                tieneSeleccion = true;
            }
        }
        const total = tieneSeleccion ? combinaciones * 10 : 0;
        document.getElementById('montoTotal').innerText = total;
    }

    function enviarPedido() {
        const nombre = document.getElementById('nombreParticipante').value.toUpperCase();
        if (!nombre) { alert("Por favor escribe tu nombre"); return; }

        // FORMATO LINEAL PARA TU SISTEMA
        let jugadaLineal = "";
        partidos.forEach((p, i) => {
            let sel = selecciones[i].join('');
            jugadaLineal += (sel === "" ? "?" : sel) + " "; 
        });

        const total = document.getElementById('montoTotal').innerText;
        let mensaje = `${nombre}: ${jugadaLineal.trim()} | Total: $${total}`;
        
        // REEMPLAZA CON TU NÚMERO
        const url = "https://wa.me/5213111234567?text=" + encodeURIComponent(mensaje);
        window.open(url, '_blank');
    }
</script>
</body>
</html>
