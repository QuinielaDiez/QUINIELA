<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA DE DIEZ GANADORA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 450px; margin: auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* SECCIÓN DEL LOGO */
        .header { background-color: #064e3b; color: white; text-align: center; padding: 20px 15px; }
        .logo-principal { width: 80px; height: 80px; background: white; border-radius: 50%; padding: 5px; margin-bottom: 10px; object-fit: contain; }
        .header h1 { margin: 0; font-size: 20px; text-transform: uppercase; }

        .input-cliente { padding: 15px; text-align: center; }
        input { width: 90%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; text-align: center; font-weight: bold; font-size: 16px; }

        .fila { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid #f3f4f6; }
        .equipo { flex: 1; font-size: 11px; font-weight: bold; color: #374151; text-transform: uppercase; }
        .izq { text-align: right; padding-right: 8px; }
        .der { text-align: left; padding-left: 8px; }

        .opciones { display: flex; gap: 4px; }
        .btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: bold; background: white; }
        .btn.active { background: #059669; color: white; border-color: #059669; }

        /* SECCIÓN DE ENVIAR */
        .footer { background: #f9fafb; padding: 20px; text-align: center; border-top: 4px solid #059669; }
        #resultado { font-size: 22px; font-weight: 900; color: #064e3b; margin-bottom: 15px; }
        .btn-enviar { background-color: #25d366; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; box-shadow: 0 4px 10px rgba(37,211,102,0.3); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- AQUÍ ESTÁ EL LOGO -->
        <img src="logos/QUINIELA.png" class="logo-principal" onerror="this.src='https://via.placeholder.com/80?text=10'">
        <h1>LA DE DIEZ GANADORA</h1>
        <p style="margin:5px 0 0; font-size: 12px; color: #a7f3d0;">SENCILLA $10 | DOBLE x2 | TRIPLE x3</p>
    </div>

    <div class="input-cliente">
        <input type="text" id="nombreCliente" placeholder="ESCRIBE TU NOMBRE">
    </div>

    <div id="lista"></div>

    <div class="footer">
        <div id="resultado">TOTAL A PAGAR: $0</div>
        <!-- AQUÍ ESTÁ EL BOTÓN DE ENVIAR -->
        <button class="btn-enviar" onclick="enviarWhatsApp()">ENVIAR POR WHATSAPP</button>
    </div>
</div>

<script>
    const partidos = [
        "REAL SOCIEDAD vs REAL BETIS", "CHIVAS vs TIGRES", "CRUZ AZUL vs ATLAS",
        "PORTLAND vs KANSAS CITY", "BARCELONA vs REAL MADRID", "PSG vs BREST",
        "TOLOUSE vs LYON", "PACHUCA vs TOLUCA", "PUMAS vs AMERICA"
    ];

    let elecciones = {};
    let totalGlobal = 0;

    function cargar() {
        const div = document.getElementById('lista');
        partidos.forEach((p, i) => {
            elecciones[i] = [];
            const [local, visita] = p.split(" vs ");
            div.innerHTML += `
                <div class="fila">
                    <div class="equipo izq">${local}</div>
                    <div class="opciones">
                        <div class="btn" id="L-${i}" onclick="marcar(${i},'L')">L</div>
                        <div class="btn" id="E-${i}" onclick="marcar(${i},'E')">E</div>
                        <div class="btn" id="V-${i}" onclick="marcar(${i},'V')">V</div>
                    </div>
                    <div class="equipo der">${visita}</div>
                </div>`;
        });
    }

    function marcar(i, tipo) {
        const btn = document.getElementById(`${tipo}-${i}`);
        if (elecciones[i].includes(tipo)) {
            elecciones[i] = elecciones[i].filter(x => x !== tipo);
            btn.classList.remove('active');
        } else {
            elecciones[i].push(tipo);
            btn.classList.add('active');
        }
        calcular();
    }

    function calcular() {
        let total = 10;
        let jugados = 0;
        for (let i in elecciones) {
            if (elecciones[i].length > 0) {
                jugados++;
                if (elecciones[i].length === 2) total *= 2;
                if (elecciones[i].length === 3) total *= 3;
            }
        }
        totalGlobal = jugados > 0 ? total : 0;
        document.getElementById('resultado').innerText = `TOTAL A PAGAR: $${totalGlobal}`;
    }

    function enviarWhatsApp() {
        const nombre = document.getElementById('nombreCliente').value;
        if (!nombre) return alert("Escribe tu nombre");
        
        let mensaje = `📌 *QUINIELA: LA DE DIEZ GANADORA*\n👤 *Cliente:* ${nombre}\n\n`;
        partidos.forEach((p, i) => {
            mensaje += `${i+1}. ${p}: *${elecciones[i].join('-') || '---'}*\n`;
        });
        mensaje += `\n💰 *TOTAL: $${totalGlobal}*`;
        
        // Pon tu número aquí (ejemplo de México: 521 + número)
        window.open(`https://wa.me/521XXXXXXXXXX?text=${encodeURIComponent(mensaje)}`);
    }

    cargar();
</script>
</body>
</html>
