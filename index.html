<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding-top: 20px; }
        .card { background-color: #004d40; color: white; border-radius: 20px; width: 90%; max-width: 450px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid #00332a; }
        .logo-container { background-color: white; width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border: 4px solid #fbc02d; overflow: hidden; }
        .logo-container img { width: 70px; height: auto; }
        .header h1 { font-size: 1.4rem; margin: 5px 0; letter-spacing: 1px; text-transform: uppercase; }
        .header p { font-size: 0.9rem; color: #b2dfdb; margin-bottom: 20px; }
        .input-nombre { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 15px; text-align: center; font-weight: bold; font-size: 1rem; box-sizing: border-box; }
        .btn-agregar { background-color: #002b23; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 60%; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.9rem; border: 1px solid #004d40; }
        .btn-agregar:hover { background-color: #004035; }
        .contenedor-lista { background: white; color: #333; border-radius: 15px; margin: 15px 0; padding: 15px; text-align: left; display: none; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        .fila-partido { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .fila-partido:last-child { border-bottom: none; }
        .opciones-lev { display: flex; gap: 5px; }
        .opciones-lev select { padding: 5px; border-radius: 5px; border: 1px solid #ccc; font-weight: bold; }
        .total-seccion { margin: 20px 0; }
        .total-txt { font-size: 1.1rem; color: #fbc02d; }
        .monto-grande { font-size: 1.8rem; font-weight: bold; color: #fbc02d; display: block; margin-top: 5px; }
        .btn-whatsapp { background-color: #25d366; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-whatsapp:hover { background-color: #1ebe57; transform: translateY(-2px); }
        .mensaje-bloqueo { background-color: #d32f2f; color: white; padding: 15px; border-radius: 15px; display: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <!-- Logo de 10 pesos que se ve en image_8a1655.png -->
        <img src="https://i.imgur.com/vHq0L9t.png" alt="Quiniela 10">
    </div>
    
    <div class="header">
        <h1>LA DE DIEZ GANADORA</h1>
        <p>Jornada de Estreno - $10 la sencilla</p>
    </div>

    <input type="text" id="nombreCliente" class="input-nombre" placeholder="NOMBRE DEL CLIENTE">

    <div id="seccionAcciones">
        <button id="btnAbrir" class="btn-agregar" onclick="abrirQuiniela()">➕ AGREGAR JUGADA</button>
        
        <div id="contenedorPartidos" class="contenedor-lista">
            <h4 style="margin-top:0; color:#004d40; border-bottom: 2px solid #fbc02d; padding-bottom:5px;">Elige tus 9 resultados:</h4>
            <div id="listaDinamica"></div>
            <button onclick="guardarJugada()" style="width:100%; background:#004d40; color:white; border:none; padding:10px; border-radius:8px; margin-top:10px; font-weight:bold; cursor:pointer;">CONFIRMAR JUGADA</button>
        </div>
    </div>

    <div class="total-seccion">
        <span class="total-txt">TOTAL A PAGAR:</span>
        <span class="monto-grande">$<span id="montoVisual">0</span></span>
    </div>

    <button id="btnEnviar" class="btn-whatsapp" onclick="enviarPedido()">
        ENVIAR A WHATSAPP 📲
    </button>

    <div id="bloqueoMsg" class="mensaje-bloqueo">
        ⚠️ REGISTRO CERRADO<br><small>Límite: Sábado 9 de Mayo 6:00 AM</small>
    </div>
</div>

<script>
// 1. LOS 9 PARTIDOS OFICIALES (Ordenados por horario de Tepic)
const partidosDelFinde = [
    { id: 1, l: "Man. City", v: "Fulham" },    // Sáb 7:00 AM
    { id: 2, l: "Real Madrid", v: "Alavés" },  // Sáb 12:00 PM
    { id: 3, l: "América", v: "Pumas" },       // Sáb 6:00 PM
    { id: 4, l: "Chivas", v: "Tigres" },       // Sáb 8:00 PM
    { id: 5, l: "Liverpool", v: "Chelsea" },   // Dom 8:30 AM
    { id: 6, l: "Toluca", v: "Pachuca" },      // Dom 11:00 AM
    { id: 7, l: "Napoli", v: "AC Milan" },     // Dom 11:45 AM
    { id: 8, l: "Barcelona", v: "Real Sociedad"},// Dom 12:00 PM
    { id: 9, l: "Cruz Azul", v: "Monterrey" }  // Dom 6:00 PM
];

let jugadasGuardadas = [];

// 2. FUNCIÓN PARA CARGAR LA LISTA DE PARTIDOS
function abrirQuiniela() {
    const lista = document.getElementById('listaDinamica');
    const contenedor = document.getElementById('contenedorPartidos');
    
    lista.innerHTML = ""; // Limpiar antes de llenar
    partidosDelFinde.forEach(p => {
        lista.innerHTML += `
            <div class="fila-partido">
                <span><b>${p.id}.</b> ${p.l} vs ${p.v}</span>
                <div class="opciones-lev">
                    <select class="sel-partido" data-id="${p.id}">
                        <option value="">-</option>
                        <option value="L">L</option>
                        <option value="E">E</option>
                        <option value="V">V</option>
                    </select>
                </div>
            </div>
        `;
    });
    contenedor.style.display = 'block';
    document.getElementById('btnAbrir').style.display = 'none';
}

function guardarJugada() {
    const selects = document.querySelectorAll('.sel-partido');
    let combinacion = [];
    let completa = true;

    selects.forEach(s => {
        if (s.value === "") completa = false;
        combinacion.push(s.value);
    });

    if (!completa) {
        alert("¡Faltan resultados! Debes elegir los 9 partidos.");
        return;
    }

    jugadasGuardadas.push(combinacion.join('-'));
    
    // Actualizar Interfaz
    document.getElementById('montoVisual').innerText = jugadasGuardadas.length * 10;
    document.getElementById('contenedorPartidos').style.display = 'none';
    document.getElementById('btnAbrir').style.display = 'flex';
    alert("✅ Jugada agregada a la lista.");
}

// 3. BLOQUEO AUTOMÁTICO (Sábado 9 de Mayo a las 6:00 AM)
function checarHora() {
    const ahora = new Date();
    // 2026, Mes 4 (Mayo), Día 9, Hora 6
    const limite = new Date(2026, 4, 9, 6, 0, 0);

    if (ahora >= limite) {
        document.getElementById('btnEnviar').style.display = 'none';
        document.getElementById('btnAbrir').style.display = 'none';
        document.getElementById('bloqueoMsg').style.display = 'block';
    }
}
setInterval(checarHora, 1000);
checarHora();

// 4. ENVÍO DE DATOS A WHATSAPP
function enviarPedido() {
    const nombre = document.getElementById('nombreCliente').value;
    const total = document.getElementById('montoVisual').innerText;

    if (!nombre) { alert("Por favor escribe el nombre del cliente."); return; }
    if (jugadasGuardadas.length === 0) { alert("Agrega al menos una jugada."); return; }

    let msg = `🏆 *LA DE DIEZ GANADORA*\n`;
    msg += `👤 *Cliente:* ${nombre.toUpperCase()}\n`;
    msg += `📅 *Fecha:* ${new Date().toLocaleDateString()}\n`;
    msg += `--------------------------\n`;
    
    jugadasGuardadas.forEach((j, i) => {
        msg += `✅ *Jugada ${i+1}:* ${j}\n`;
    });

    msg += `--------------------------\n`;
    msg += `💰 *TOTAL A PAGAR: $${total}*`;

    const url = `https://wa.me/523113405833?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
}
</script>

</body>
</html>
