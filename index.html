<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA DE DIEZ GANADORA</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; }
        .container { max-width: 450px; margin: auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 1px solid #ddd; }
        
        .header { background-color: #064e3b; color: white; text-align: center; padding: 15px; }
        .logo-img { width: 80px; height: 80px; margin-bottom: 8px; border-radius: 50%; background: white; object-fit: contain; border: 3px solid #fff; }
        .header h1 { margin: 0; font-size: 18px; text-transform: uppercase; }
        .header p { margin: 4px 0 0; font-size: 11px; color: #a7f3d0; font-weight: bold; }

        .seccion-user { padding: 12px; text-align: center; background: #f9f9f9; border-bottom: 1px solid #eee; }
        input { width: 90%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; text-align: center; font-weight: bold; font-size: 14px; text-transform: uppercase; }

        .fila { display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; border-bottom: 1px solid #f0f0f0; }
        .eq { width: 35%; font-size: 12px; font-weight: 800; color: #000; text-transform: uppercase; line-height: 1.2; }
        .iz { text-align: right; }
        .de { text-align: left; }
        
        .btns { display: flex; gap: 6px; }
        .b-v { width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; border: 2px solid #bbb; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; background: #fff; color: #333; }
        .b-v.active { background-color: #059669; color: white; border-color: #059669; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }

        .footer-cont { padding: 15px; background: #fdfdfd; text-align: center; border-top: 2px solid #eee; }
        .txt-costo { font-size: 16px; font-weight: 800; color: #064e3b; margin-bottom: 10px; }
        .btn-g { background-color: #064e3b; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-transform: uppercase; }

        /* ESTILO CORREGIDO PARA QUE SE VEA LA JUGADA */
        .ticket { padding: 10px; background: #f0f0f0; max-height: 250px; overflow-y: auto; }
        .card { background: white; padding: 12px; border-radius: 6px; margin-bottom: 8px; border-left: 6px solid #059669; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .card-prog { 
            display: block; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 14px; 
            color: #000; 
            font-weight: 900; 
            background: #f1f1f1; 
            padding: 8px; 
            border-radius: 4px;
            text-align: center;
            border: 1px solid #ccc;
        }
        .btn-del { background: #e11d48; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .final { background: #064e3b; padding: 20px; text-align: center; }
        #total-pago { color: white; font-size: 20px; font-weight: 900; margin-bottom: 15px; }
        .btn-wa { background-color: #25d366; color: white; border: none; padding: 16px; width: 100%; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body onload="iniciar()">

<div class="container">
    <div class="header">
        <img src="logo.jpg" class="logo-img" alt="Logo" onerror="this.src='https://via.placeholder.com/80?text=10'">
        <h1>LA DE DIEZ GANADORA</h1>
        <p>Sencilla $10 | Doble x2 | Triple x3</p>
    </div>

    <div class="seccion-user">
        <input type="text" id="usuario" placeholder="ESCRIBE TU NOMBRE">
    </div>

    <div id="partidos-list"></div>

    <div class="footer-cont">
        <div class="txt-costo" id="c-actual">Importe Jugada: $0</div>
        <button class="btn-g" onclick="guardarJugada()">+ GUARDAR JUGADA</button>
    </div>

    <div class="ticket" id="resumen"></div>

    <div class="final">
        <div id="total-pago">TOTAL A PAGAR: $0</div>
        <button class="btn-wa" onclick="enviar()">ENVIAR POR WHATSAPP</button>
    </div>
</div>

<script>
    const partidos = [
        {l: "AMÉRICA", v: "PUMAS"}, {l: "TOLUCA", v: "PACHUCA"},
        {l: "CANCÚN", v: "JAIBA BRAVA"}, {l: "TEPATITLÁN", v: "MINEROS"},
        {l: "AUSTIN", v: "LOUIS CITY"}, {l: "INTERNACIONAL", v: "FLUMINENSE"},
        {l: "MIRASSOL", v: "CORINTHIANS"}, {l: "BARCELONA", v: "R. SOCIEDAD"},
        {l: "MAN. CITY", v: "ARSENAL"}
    ];

    let actual = {};
    let ticket = [];

    function iniciar() {
        const d = document.getElementById('partidos-list');
        let html = "";
        partidos.forEach((p, i) => {
            actual[i] = [];
            html += `
                <div class="fila">
                    <div class="eq iz">${p.l}</div>
                    <div class="btns">
                        <div class="b-v" id="L-${i}" onclick="sel(${i},'L')">L</div>
                        <div class="b-v" id="E-${i}" onclick="sel(${i},'E')">E</div>
                        <div class="b-v" id="V-${i}" onclick="sel(${i},'V')">V</div>
                    </div>
                    <div class="eq de">${p.v}</div>
                </div>`;
        });
        d.innerHTML = html;
    }

    function sel(idx, t) {
        const btn = document.getElementById(`${t}-${idx}`);
        if (actual[idx].includes(t)) {
            actual[idx] = actual[idx].filter(x => x !== t);
            btn.classList.remove('active');
        } else {
            actual[idx].push(t);
            btn.classList.add('active');
        }
        calcular();
    }

    function obtenerLineaOrdenada(datos) {
        let linea = [];
        const orden = {"L": 1, "E": 2, "V": 3};
        for (let i = 0; i < 9; i++) {
            let combo = [...datos[i]].sort((a, b) => orden[a] - orden[b]).join('');
            linea.push(combo || "---");
        }
        return linea.join(' ');
    }

    function calcular() {
        let costo = 10, completos = 0;
        for (let k in actual) {
            let n = actual[k].length;
            if (n > 0) completos++;
            if (n === 2) costo *= 2;
            if (n === 3) costo *= 3;
        }
        const r = completos === 9 ? costo : 0;
        document.getElementById('c-actual').innerText = `Importe Jugada: $${r}`;
        return r;
    }

    function guardarJugada() {
        const c = calcular();
        if (c === 0) return alert("Selecciona los 9 partidos");
        
        ticket.push({ 
            datos: JSON.parse(JSON.stringify(actual)), 
            precio: c,
            resumenTexto: obtenerLineaOrdenada(actual)
        });
        
        for (let k in actual) {
            actual[k] = [];
            ['L','E','V'].forEach(t => {
                const b = document.getElementById(`${t}-${k}`);
                if(b) b.classList.remove('active');
            });
        }
        dibujarTicket();
        document.getElementById('c-actual').innerText = "Importe Jugada: $0";
    }

    function borrar(i) {
        ticket.splice(i, 1);
        dibujarTicket();
    }

    function dibujarTicket() {
        const r = document.getElementById('resumen');
        let h = "", total = 0;
        ticket.forEach((j, i) => {
            total += j.precio;
            h += `
            <div class="card">
                <div class="card-top">
                    <span><b>Jugada #${i+1}</b> ($${j.precio})</span>
                    <button class="btn-del" onclick="borrar(${i})">Eliminar</button>
                </div>
                <div class="card-prog">${j.resumenTexto}</div>
            </div>`;
        });
        r.innerHTML = h;
        document.getElementById('total-pago').innerText = `TOTAL A PAGAR: $${total}`;
    }

    function enviar() {
        const u = document.getElementById('usuario').value;
        if (!u || ticket.length === 0) return alert("Escribe tu nombre y guarda tus jugadas");
        let m = `◈ *LA DE DIEZ GANADORA*\n◈ *Cliente:* ${u.toUpperCase()}\n\n`;
        let total = 0;
        ticket.forEach((j, idx) => {
            total += j.precio;
            m += `◈ *J${idx + 1}:* ${j.resumenTexto} ($${j.precio})\n`;
        });
        m += `\n◈ *TOTAL A PAGAR: $${total}*`;
        window.open(`https://wa.me/523113405833?text=${encodeURIComponent(m)}`);
    }
</script>
</body>
</html>
