<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        /* Estilos exactos para igualar tu captura */
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .card { background-color: #004d40; color: white; border-radius: 25px; width: 450px; padding: 30px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .logo-circulo { background: white; width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; border: 3px solid #fbc02d; }
        .logo-circulo img { width: 60px; }
        h1 { font-size: 1.3rem; margin: 5px 0; letter-spacing: 1px; }
        .sub { font-size: 0.9rem; margin-bottom: 20px; color: #eee; }
        .input-nombre { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 15px; text-align: center; font-size: 1rem; font-weight: bold; text-transform: uppercase; }
        .btn-agregar { background-color: #002b23; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 60%; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; }
        
        /* ESTO ES LO QUE FALTA EN TU CÓDIGO: El contenedor de partidos */
        #contenedorPartidos { background: white; color: black; border-radius: 15px; padding: 15px; margin: 15px 0; text-align: left; display: none; /* Inicia oculto */ }
        .fila { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 5px; font-size: 0.85rem; }
        
        .total-pago { font-weight: bold; font-size: 1.4rem; margin: 20px 0; color: #fbc02d; }
        .btn-whatsapp { background-color: #2ecc71; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-circulo">
        <img src="https://i.imgur.com/vHq0L9t.png" alt="10">
    </div>

    <h1>LA DE DIEZ GANADORA</h1>
    <p class="sub">Jornada 2 - $10 la sencilla</p>

    <input type="text" id="nombreCliente" class="input-nombre" placeholder="JUAN PEREZ">

    <!-- BOTÓN QUE ABRE LOS PARTIDOS -->
    <button class="btn-agregar" onclick="mostrarLista()">+ AGREGAR JUGADA</button>

    <!-- LISTA QUE APARECE AL DAR CLIC -->
    <div id="contenedorPartidos">
        <div id="listaPartidos"></div>
        <button onclick="confirmar()" style="width:100%; background:#004d40; color:white; border:none; padding:10px; border-radius:10px; margin-top:10px; cursor:pointer;">LISTO ✅</button>
    </div>

    <div style="text-align: right; font-size: 0.8rem; margin-top: 10px;">
        Costo jugada: <span id="costo">$0</span>
    </div>

    <div class="total-pago">
        TOTAL A PAGAR: $<span id="total">0</span>
    </div>

    <button class="btn-whatsapp" onclick="enviar()">ENVIAR A WHATSAPP 📲</button>
</div>

<script>
// LOS 9 PARTIDOS EN EL ORDEN QUE PEDISTE
const partidos = [
    { id: 1, l: "Man. City", v: "Fulham" },
    { id: 2, l: "Real Madrid", v: "Alavés" },
    { id: 3, l: "América", v: "Pumas" },
    { id: 4, l: "Chivas", v: "Tigres" },
    { id: 5, l: "Liverpool", v: "Chelsea" },
    { id: 6, l: "Toluca", v: "Pachuca" },
    { id: 7, l: "Napoli", v: "AC Milan" },
    { id: 8, l: "Barcelona", v: "Real Sociedad" },
    { id: 9, l: "Cruz Azul", v: "Monterrey" }
];

let jugadas = [];

function mostrarLista() {
    const lista = document.getElementById('listaPartidos');
    lista.innerHTML = ""; // Limpiar
    partidos.forEach(p => {
        lista.innerHTML += `
            <div class="fila">
                <span><b>${p.id}.</b> ${p.l} vs ${p.v}</span>
                <select class="sel-partido">
                    <option value="L">L</option>
                    <option value="E">E</option>
                    <option value="V">V</option>
                </select>
            </div>
        `;
    });
    document.getElementById('contenedorPartidos').style.display = 'block';
}

function confirmar() {
    const seleccionados = document.querySelectorAll('.sel-partido');
    let comb = [];
    seleccionados.forEach(s => comb.push(s.value));
    
    jugadas.push(comb.join('-'));
    document.getElementById('total').innerText = jugadas.length * 10;
    document.getElementById('costo').innerText = "$" + (jugadas.length * 10);
    document.getElementById('contenedorPartidos').style.display = 'none';
    alert("¡Jugada agregada!");
}

function enviar() {
    const nombre = document.getElementById('nombreCliente').value;
    if(!nombre || jugadas.length === 0) return alert("Pon tu nombre y agrega jugadas");
    
    let msg = `🏆 *LA DE DIEZ GANADORA*\n👤 *Cliente:* ${nombre}\n`;
    jugadas.forEach((j, i) => msg += `✅ Jugada ${i+1}: ${j}\n`);
    msg += `💰 *Total:* $${jugadas.length * 10}`;
    
    window.open(`https://wa.me/523113405833?text=${encodeURIComponent(msg)}`);
}

// BLOQUEO AUTOMÁTICO SÁBADO 6 AM
setInterval(() => {
    const ahora = new Date();
    const limite = new Date(2026, 4, 9, 6, 0, 0); // Mayo 9, 6 AM
    if (ahora >= limite) {
        document.querySelector('.card').innerHTML = "<h2 style='color:white'>JORNADA CERRADA ⚠️</h2>";
    }
}, 1000);
</script>

</body>
</html>
