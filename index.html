<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La de Diez Ganadora</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding-top: 20px; margin: 0; }
        .card { background-color: #004d40; color: white; border-radius: 25px; width: 450px; padding: 25px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        .logo-circulo { background: white; width: 85px; height: 85px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; border: 4px solid #fbc02d; overflow: hidden; }
        .logo-circulo img { width: 100%; height: auto; }
        
        h1 { font-size: 1.3rem; margin: 5px 0; text-transform: uppercase; letter-spacing: 1px; }
        .input-nombre { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 15px; text-align: center; font-size: 1.1rem; font-weight: bold; }
        
        .btn-agregar { background-color: #002b23; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 60%; font-weight: bold; margin-bottom: 15px; }

        /* Contenedor de Partidos Mejorado */
        #contenedorPartidos { background: white; color: #333; border-radius: 20px; padding: 15px; margin: 15px 0; display: none; }
        .fila-partido { border-bottom: 1px solid #eee; padding: 12px 0; }
        .equipos { display: block; font-weight: bold; margin-bottom: 10px; font-size: 0.9rem; color: #004d40; text-align: center; }
        
        /* Botones L E V */
        .opciones { display: flex; justify-content: center; gap: 15px; }
        .opc { background: #f0f2f5; border: 2px solid #ddd; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .opc.active { background: #fbc02d; border-color: #fbc02d; color: #004d40; transform: scale(1.1); }
        
        .monto { font-size: 2.2rem; font-weight: bold; color: #fbc02d; margin: 10px 0; display: block; }
        .btn-whatsapp { background-color: #2ecc71; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-circulo">
        <img src="logo.jpg" alt="Logo">
    </div>

    <h1>LA DE DIEZ GANADORA</h1>
    <p style="color:#b2dfdb; margin-bottom: 20px;">Jornada de Estreno - $10 la sencilla</p>

    <input type="text" id="nombreCliente" class="input-nombre" placeholder="NOMBRE DEL CLIENTE">

    <button class="btn-agregar" id="btnShow" onclick="abrirQuiniela()">➕ AGREGAR JUGADA</button>
    
    <div id="contenedorPartidos">
        <div id="lista"></div>
        <button onclick="guardarJugada()" style="width:100%; background:#004d40; color:white; border:none; padding:12px; border-radius:12px; margin-top:15px; cursor:pointer; font-weight:bold;">LISTO ✅</button>
    </div>

    <div style="margin-top:20px">
        TOTAL A PAGAR:<br>
        <span class="monto">$<span id="txtTotal">0</span></span>
    </div>

    <button class="btn-whatsapp" onclick="enviarWhatsApp()">ENVIAR A WHATSAPP 📲</button>
</div>

<script>
const partidos = [
    {id: 1, l: "Man. City", v: "Fulham"}, {id: 2, l: "Real Madrid", v: "Alavés"},
    {id: 3, l: "América", v: "Pumas"}, {id: 4, l: "Chivas", v: "Tigres"},
    {id: 5, l: "Liverpool", v: "Chelsea"}, {id: 6, l: "Toluca", v: "Pachuca"},
    {id: 7, l: "Napoli", v: "AC Milan"}, {id: 8, l: "Barcelona", v: "Real Sociedad"},
    {id: 9, l: "Cruz Azul", v: "Monterrey"}
];

let jugadas = [];
let seleccionActual = {};

function abrirQuiniela() {
    const lista = document.getElementById('lista');
    lista.innerHTML = "";
    seleccionActual = {}; // Reset selección temporal
    
    partidos.forEach(p => {
        lista.innerHTML += `
            <div class="fila-partido">
                <span class="equipos">${p.id}. ${p.l} vs ${p.v}</span>
                <div class="opciones">
                    <div class="opc" onclick="seleccionar(${p.id}, 'L', this)">L</div>
                    <div class="opc" onclick="seleccionar(${p.id}, 'E', this)">E</div>
                    <div class="opc" onclick="seleccionar(${p.id}, 'V', this)">V</div>
                </div>
            </div>
        `;
    });
    document.getElementById('contenedorPartidos').style.display = 'block';
    document.getElementById('btnShow').style.display = 'none';
}

function seleccionar(partidoId, valor, elemento) {
    // Quitar activo de los otros botones del mismo partido
    const hermanos = elemento.parentElement.children;
    for(let h of hermanos) h.classList.remove('active');
    
    // Marcar el actual
    elemento.classList.add('active');
    seleccionActual[partidoId] = valor;
}

function guardarJugada() {
    if(Object.keys(seleccionActual).length < 9) {
        return alert("¡Faltan resultados! Selecciona L, E o V en los 9 partidos.");
    }
    
    // Crear el string de la jugada
    const combinacion = partidos.map(p => seleccionActual[p.id]).join('-');
    jugadas.push(combinacion);
    
    document.getElementById('txtTotal').innerText = jugadas.length * 10;
    document.getElementById('contenedorPartidos').style.display = 'none';
    document.getElementById('btnShow').style.display = 'block';
}

function enviarWhatsApp() {
    const nom = document.getElementById('nombreCliente').value;
    if(!nom || jugadas.length === 0) return alert("Escribe el nombre y agrega al menos una jugada");
    
    let msg = `🏆 *LA DE DIEZ GANADORA*\n👤 *Cliente:* ${nom.toUpperCase()}\n`;
    jugadas.forEach((j, i) => msg += `✅ Jugada ${i+1}: ${j}\n`);
    msg += `💰 *Total:* $${jugadas.length * 10}`;
    
    window.open(`https://wa.me/523113405833?text=${encodeURIComponent(msg)}`);
}
</script>
</body>
</html>
